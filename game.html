<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Block Drop, a falling-block puzzle game.">
    <title>Block Drop | Darian Evans</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme-light.css" id="theme">
    <script src="js/shared.js" defer></script>
    <script src="js/game.js" defer></script>
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
<header>
    <h1>Darian Evans</h1>
    <button type="button" id="theme-toggle">Switch theme</button>
</header>
<nav aria-label="main navigation">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="game.html" aria-current="page">Block Drop</a></li>
    </ul>
</nav>
<main>
    <h2>Block Drop</h2>
    <div class="game-layout">
        <div id="board"></div>
        <aside class="tray">
            <h3>Score</h3>
            <p class="score"><output id="score">0</output></p>
            <h3>Next</h3>
            <div class="preview" id="preview-0"></div>
            <div class="preview" id="preview-1"></div>
            <div class="preview" id="preview-2"></div>
        </aside>
    </div>
    <p>
        <button type="button" id="restart">Restart</button>
        <button type="button" id="pause">Pause</button>
    </p>

    <dialog id="game-over">
        <h3>Game over</h3>
        <p>You scored <output id="final-score">0</output>.</p>
        <button type="button" id="play-again" autofocus>Play again</button>
    </dialog>
    <p><a href="index.html#projects">Back to my current projects</a></p>
</main>

<footer>
    <p><small>&copy; <span id="year">2026</span> Darian Evans &middot; Built for CIS 1440</small></p>
    <p><small> Weather Icons by
        <a href="https://www.svgrepo.com/" target="_blank" rel="noopener noreferrer">SVG Repo</a>
    </small></p>
</footer>
</body>
</html>
